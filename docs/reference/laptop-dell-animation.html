<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Laptop Animation - Dell Latitude</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .info {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #ffffff;
            font-size: 12px;
            opacity: 0.7;
            text-align: left;
            max-width: 300px;
            line-height: 1.6;
        }

        .info p {
            margin: 4px 0;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffffff;
            font-size: 16px;
            opacity: 0.8;
            z-index: 10;
        }

        .loading.hidden {
            display: none;
        }

        @media (prefers-reduced-motion: reduce) {
            body {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="loading" id="loading">Loading 3D scene...</div>
    
    <div class="info">
        <p>💻 <strong>Dell Latitude 5400 3D Model</strong></p>
        <p>🖱️ Move your mouse to rotate</p>
        <p>📱 Touch to interact</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/GLTFLoader.min.js"></script>

    <script>
        // Scene Setup
        const canvas = document.getElementById('canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowShadowMap;
        renderer.setClearColor(0x1a1a2e);

        camera.position.set(0, 0.5, 2.5);
        camera.lookAt(0, 0, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 8, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 50;
        dirLight.shadow.camera.left = -10;
        dirLight.shadow.camera.right = 10;
        dirLight.shadow.camera.top = 10;
        dirLight.shadow.camera.bottom = -10;
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x00ffff, 0.3);
        pointLight.position.set(-3, 2, 3);
        scene.add(pointLight);

        // Mouse tracking
        let mouseX = 0;
        let mouseY = 0;
        let targetRotationX = 0;
        let targetRotationY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
            
            targetRotationY = mouseX * 0.5;
            targetRotationX = mouseY * 0.3;
        });

        document.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            mouseX = (touch.clientX / window.innerWidth) * 2 - 1;
            mouseY = -(touch.clientY / window.innerHeight) * 2 + 1;
            
            targetRotationY = mouseX * 0.5;
            targetRotationX = mouseY * 0.3;
        });

        // Load textures
        const textureLoader = new THREE.TextureLoader();
        let lockscreenTexture = null;

        textureLoader.load('/images/hyprlock-shot.png', (texture) => {
            lockscreenTexture = texture;
            lockscreenTexture.encoding = THREE.sRGBEncoding;
            lockscreenTexture.magFilter = THREE.LinearFilter;
            lockscreenTexture.minFilter = THREE.LinearFilter;
            applyScreenTexture();
        }, undefined, (error) => {
            console.warn('Lockscreen texture not found at /images/hyprlock-shot.png, using fallback.');
            createFallbackScreenTexture();
        });

        // Load 3D Model
        const gltfLoader = new THREE.GLTFLoader();
        let laptop = null;
        let screenMesh = null;

        gltfLoader.load('/models/laptop_dell.glb', (gltf) => {
            laptop = gltf.scene;
            laptop.scale.set(1, 1, 1);
            laptop.position.y = -0.2;
            
            // Log scene structure for debugging
            console.log('Model loaded:', gltf.scene);
            gltf.scene.traverse((node) => {
                console.log('Node:', node.name, node.type);
            });
            
            // Enable shadows
            laptop.traverse((node) => {
                if (node.isMesh) {
                    node.castShadow = true;
                    node.receiveShadow = true;
                    
                    // Find screen mesh - Dell specific naming
                    if (node.name.toLowerCase().includes('screen') || 
                        node.name.toLowerCase().includes('display') ||
                        node.name.toLowerCase().includes('lcd') ||
                        node.name.toLowerCase().includes('panel') ||
                        node.material.emissive) {
                        screenMesh = node;
                        console.log('Found screen mesh:', node.name);
                    }
                }
            });

            // If we found the screen, apply texture
            if (screenMesh && lockscreenTexture) {
                applyScreenTexture();
            } else if (screenMesh) {
                createFallbackScreenTexture();
            } else {
                console.warn('Screen mesh not found. Available meshes logged above.');
            }

            scene.add(laptop);
            document.getElementById('loading').classList.add('hidden');
        }, undefined, (error) => {
            console.error('Failed to load model:', error);
            document.getElementById('loading').textContent = 'Failed to load 3D model';
        });

        function applyScreenTexture() {
            if (!screenMesh || !lockscreenTexture) return;

            const screenMaterial = new THREE.MeshStandardMaterial({
                map: lockscreenTexture,
                emissive: 0xffffff,
                emissiveMap: lockscreenTexture,
                emissiveIntensity: 0.3,
                metalness: 0.1,
                roughness: 0.4,
            });

            screenMesh.material = screenMaterial;
            console.log('Screen texture applied successfully');
        }

        function createFallbackScreenTexture() {
            // Fallback: dark screen with subtle glow
            const canvas = document.createElement('canvas');
            canvas.width = 1920;
            canvas.height = 1080;
            const ctx = canvas.getContext('2d');
            
            // Dark background
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Some text
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 80px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('Loading...', canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            texture.encoding = THREE.sRGBEncoding;

            if (screenMesh) {
                const material = new THREE.MeshStandardMaterial({
                    map: texture,
                    emissive: 0x111111,
                    emissiveIntensity: 0.2,
                    metalness: 0.1,
                    roughness: 0.4,
                });
                screenMesh.material = material;
                console.log('Fallback texture applied');
            }
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);

            if (laptop) {
                // Smooth rotation towards mouse position
                laptop.rotation.x += (targetRotationX - laptop.rotation.x) * 0.08;
                laptop.rotation.y += (targetRotationY - laptop.rotation.y) * 0.08;
                
                // Subtle auto-rotation when idle
                if (Math.abs(mouseX) < 0.01 && Math.abs(mouseY) < 0.01) {
                    laptop.rotation.y += 0.0005;
                }
            }

            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Respect prefers-reduced-motion
        const mediaQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
        if (mediaQuery.matches) {
            console.log('Reduced motion enabled');
        }

        animate();
    </script>
</body>
</html>
